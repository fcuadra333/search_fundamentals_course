[project]
name = "cuadre"
version = "1.0.0"
description = "Sistema de conciliaciones contables asistidas por IA para firmas contables"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:cuadre.*"]
